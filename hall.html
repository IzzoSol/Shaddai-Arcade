<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Hall — Shaddai Arcade</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* hall.html — Shaddai-Arcade issue #6 (TURTLE). Owner-approved direction:
     reuse Royale's existing neon-casino look (styles.css's --navy/--gold/
     --felt/--cyan vars + Cinzel/Cormorant font stack), no redesign — just
     the seat/mailbox/Sparks/Lens wiring on top, per docs/HALL-PHASE1-SPEC.md
     ("Royale's existing neon-casino UI is the visual base... it gets the
     seat/mailbox + Sparks + Lens wiring, not a redesign"). Mobile-first per
     owner request: single-column, large touch targets, no hover-only
     affordances, safe-area padding for notch/home-indicator devices.
     Copy sourced from docs/HALL-COPY.md (issue #7) — do not freehand new
     player-facing strings here without updating that doc too. */
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  .hall-topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.75rem; padding: 0.75rem 1rem;
    background: linear-gradient(180deg, var(--navy) 0%, rgba(4,13,26,0.92) 100%);
    border-bottom: 1px solid var(--gold-dim);
  }
  .hall-brand { font-family: 'Cinzel Decorative', serif; color: var(--gold-bright); font-size: clamp(1.1rem, 4vw, 1.5rem); text-shadow: var(--shadow-gold); }
  .hall-topbar-right { display: flex; align-items: center; gap: 0.6rem; }
  .hall-pill {
    font-family: 'Share Tech Mono', monospace; font-size: 0.85rem;
    color: var(--cream); background: var(--navy-light);
    border: 1px solid var(--gold-dim); border-radius: 999px;
    padding: 0.35rem 0.75rem; white-space: nowrap;
  }
  .hall-icon-btn {
    font-size: 1.1rem; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid var(--gold-dim); background: var(--navy-light); color: var(--cream);
  }
  .hall-icon-btn:active { background: var(--felt-rim); }

  .hall-main { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 3rem; }
  .hall-mode-chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold-bright);
    border: 1px solid var(--gold-dim); border-radius: 999px; padding: 0.25rem 0.7rem; margin-bottom: 0.75rem;
  }

  .hall-room-grid { display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
  @media (min-width: 560px) { .hall-room-grid { grid-template-columns: 1fr 1fr; } }

  .hall-table-card {
    position: relative; border-radius: 14px; padding: 1rem;
    background: radial-gradient(120% 140% at 30% 0%, var(--felt-mid) 0%, var(--felt) 70%);
    border: 1px solid var(--felt-rim); box-shadow: var(--glow-gold); cursor: pointer;
    min-height: 120px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .hall-table-card:active { transform: scale(0.98); }
  .hall-table-name { font-family: 'Cinzel', serif; color: var(--white); font-size: 1.05rem; }
  .hall-table-sub { font-family: 'Cormorant Garamond', serif; color: var(--cream); opacity: 0.85; font-size: 0.95rem; margin-top: 0.25rem; }
  .hall-table-tag { align-self: flex-start; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: 6px; padding: 0.15rem 0.45rem; margin-top: 0.6rem; }

  .hall-table-view { display: none; }
  .hall-table-view.active { display: block; }
  .hall-status-line { font-family: 'Cormorant Garamond', serif; color: var(--cream); font-size: 1.05rem; min-height: 1.6em; margin: 0.75rem 0; }
  .hall-hand-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0.5rem 0; }
  .hall-card { font-family: 'Share Tech Mono', monospace; background: var(--white); color: var(--navy); border-radius: 6px; padding: 0.4rem 0.6rem; font-weight: bold; min-width: 2.2rem; text-align: center; }

  .hall-rail {
    position: sticky; bottom: 0; z-index: 20;
    display: flex; gap: 0.6rem; padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--navy) 0%, rgba(4,13,26,0.92) 100%);
    border-top: 1px solid var(--gold-dim);
  }
  .hall-rail-btn {
    flex: 1; min-height: 52px; border-radius: 10px;
    font-family: 'Cinzel', serif; font-size: 1rem; color: var(--navy);
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
    border: 1px solid var(--gold-dim);
  }
  .hall-rail-btn:active { filter: brightness(0.92); }
  .hall-rail-btn.secondary { background: var(--navy-light); color: var(--cream); border-color: var(--gold-dim); }
  .hall-rail-btn.lens { background: linear-gradient(180deg, var(--cyan) 0%, var(--cyan-dim) 100%); color: var(--navy); }
  .hall-rail-btn:disabled { opacity: 0.4; }

  .hall-back { font-family: 'Share Tech Mono', monospace; color: var(--cream); font-size: 0.85rem; background: none; border: none; padding: 0.5rem 0; min-height: 44px; }

  .hall-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--navy-light); border: 1px solid var(--gold); color: var(--cream);
    font-family: 'Cormorant Garamond', serif; font-size: 1rem;
    padding: 0.6rem 1rem; border-radius: 10px; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .hall-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="hall-topbar">
  <div class="hall-brand">The Hall</div>
  <div class="hall-topbar-right">
    <span class="hall-pill" id="sparks-pill">Sparks: —</span>
    <button class="hall-icon-btn" id="btn-line" title="Line (coach chat)">💬</button>
  </div>
</div>

<main class="hall-main">

  <!-- ROOM: table list. Click felt = sit. No "choose a game" menu beyond
       this list, per HALL-PHASE1-SPEC.md ("the room is the navigation"). -->
  <section id="view-room">
    <div class="hall-mode-chip">Versus · house</div>
    <div class="hall-room-grid" id="room-grid"><!-- filled by JS from /api/hall/seats + fixed pack list --></div>
  </section>

  <!-- TABLE: one active match at a time (phase-1 solo-vs-house scope). -->
  <section id="view-table" class="hall-table-view">
    <button class="hall-back" id="btn-leave-table">‹ Back to the room</button>
    <h2 class="font-title" id="table-title" style="color:var(--gold-bright)"></h2>
    <div class="hall-status-line" id="table-status">—</div>
    <div class="hall-hand-row" id="table-hand"></div>
  </section>
</main>

<div class="hall-rail" id="rail" style="display:none">
  <!-- filled with up to 3 legal buttons, per ENGINE-VISION.md's "always <=3" rule -->
</div>

<div class="hall-toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ── Copy (docs/HALL-COPY.md — keep these two files in sync) ──────────────
  const COPY = {
    buyinConfirm: (w) => `Sit in for ${w} Sparks?`,
    buyinInsufficient: (w, bal) => `You need ${w} Sparks to sit in — you've got ${bal}.`,
    buyinToast: (w) => `You're in. ${w} Sparks on the table.`,
    illegalHuman: "That's not one of your options right now. Pick one of the highlighted buttons.",
    outcome: {
      win: (p, r) => r > 0 ? `You win ${p} Sparks. (house keeps a ${r}-Spark cut)` : `You win ${p} Sparks.`,
      blackjack: (p, r) => r > 0 ? `Blackjack! ${p} Sparks. (house keeps a ${r}-Spark cut)` : `Blackjack! ${p} Sparks.`,
      push: (w) => `Push — your ${w} Sparks are back.`,
      lose: 'House takes it this time.',
      bust: 'House takes it this time.',
    },
    lensButton: '🎬 Lens this — 15 Sparks',
    lensConfirm: 'Turn this into a clip for 15 Sparks?',
    lensRolling: 'Rolling the clip... this usually takes under a minute.',
    lensReady: "Clip's ready.",
    lensFail: "Couldn't get the shot this time. Your 15 Sparks are back in your balance.",
    lensInsufficient: (bal) => `You need 15 Sparks for a Lens clip — you've got ${bal}.`,
    lensNoEvent: 'Nothing to film right now — Lens only works right after a bust, win, or blackjack.',
    lensDisabled: "Lens isn't running at this table yet. Check back soon.",
  };

  // ── Table catalog (mirrors hall/packs/index.js) ──────────────────────────
  const TABLES = [
    { pack: 'blackjack', name: 'Blackjack', sub: 'Hit, stand, or double against the house.', tag: 'Solo · vs house' },
    { pack: 'hoops_bet', name: 'Neon Hoops', sub: 'Back NEXUS or PIKADON to win the exhibition.', tag: 'Watch & bet' },
    { pack: 'gridiron_bet', name: 'Gridiron', sub: 'Back ZEROX or TURTLE to win the exhibition.', tag: 'Watch & bet' },
    { pack: 'dodgeball_bet', name: 'Dodgeball', sub: 'Back ORACLE or QUILL to win the exhibition.', tag: 'Watch & bet' },
    { pack: 'starfall_bet', name: 'Starfall', sub: 'Back SHADDAI or NEXUS to win the exhibition.', tag: 'Watch & bet' },
  ];
  const DEFAULT_WAGER = 25;

  // ── Seat identity: one human seat per browser, remembered locally.
  //    Real login-linked identity is out of scope for this pass — this is
  //    the swivel page's own seat, same as HALL-PHASE1-SPEC.md's minimal
  //    "click felt = sit" flow. ────────────────────────────────────────────
  let seatId = localStorage.getItem('hall_seat_id');
  let matchId = null;
  let currentPack = null;

  function toast(msg, ms) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms || 2600);
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method, headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw Object.assign(new Error(data.error || `${method} ${path} failed`), { status: res.status, data });
    return data;
  }

  async function ensureSeat() {
    if (seatId) return seatId;
    const { seat } = await api('POST', '/api/hall/seats', { kind: 'human', display_name: 'You' });
    seatId = seat.id;
    localStorage.setItem('hall_seat_id', seatId);
    return seatId;
  }

  function renderRoom() {
    const grid = document.getElementById('room-grid');
    grid.innerHTML = '';
    for (const t of TABLES) {
      const card = document.createElement('div');
      card.className = 'hall-table-card';
      card.innerHTML = `
        <div>
          <div class="hall-table-name font-title">${t.name}</div>
          <div class="hall-table-sub">${t.sub}</div>
        </div>
        <div class="hall-table-tag">${t.tag}</div>`;
      card.addEventListener('click', () => sitAt(t));
      grid.appendChild(card);
    }
  }

  async function sitAt(table) {
    try {
      await ensureSeat();
      if (!confirm(COPY.buyinConfirm(DEFAULT_WAGER))) return;
      const res = await api('POST', '/api/hall/tables', { seatId, wager: DEFAULT_WAGER, pack: table.pack });
      if (res.settlement && res.settlement.sparksError) {
        toast(COPY.buyinInsufficient(DEFAULT_WAGER, '—'));
        return;
      }
      toast(COPY.buyinToast(DEFAULT_WAGER));
      matchId = res.matchId;
      currentPack = table;
      showTable(table, res.state, res.legal, res.settlement);
    } catch (e) {
      toast(e.message || 'Could not open that table.');
    }
  }

  function showTable(table, state, legal, settlement) {
    document.getElementById('view-room').style.display = 'none';
    document.getElementById('view-table').classList.add('active');
    document.getElementById('table-title').textContent = table.name;
    renderHand(state);
    renderStatus(state, settlement);
    renderRail(legal, settlement);
  }

  function renderHand(state) {
    const row = document.getElementById('table-hand');
    row.innerHTML = '';
    // Blackjack-specific hand render; bet packs have no cards to show.
    if (state && state.player && Array.isArray(state.player.cards)) {
      for (const c of state.player.cards) {
        const el = document.createElement('span');
        el.className = 'hall-card';
        el.textContent = `${c.r}${c.s}`;
        row.appendChild(el);
      }
    }
  }

  function renderStatus(state, settlement) {
    const el = document.getElementById('table-status');
    const score = settlement && settlement.score;
    if (!score) { el.textContent = currentPack && currentPack.pack === 'blackjack' ? 'Your move.' : 'Pick a side.'; return; }
    const payout = settlement.payout; // not returned by the API today — informational copy only when present
    if (score === 'win' || score === 'blackjack') el.textContent = COPY.outcome[score](payout || '', 0);
    else if (score === 'push') el.textContent = COPY.outcome.push(currentPack ? DEFAULT_WAGER : '');
    else el.textContent = COPY.outcome.lose;
  }

  function renderRail(legal, settlement) {
    const rail = document.getElementById('rail');
    rail.innerHTML = '';
    const over = settlement && settlement.score;
    if (over) {
      rail.style.display = 'flex';
      const canLens = settlement.events && settlement.events.length;
      const lensBtn = document.createElement('button');
      lensBtn.className = 'hall-rail-btn lens';
      lensBtn.textContent = COPY.lensButton;
      lensBtn.disabled = !canLens;
      lensBtn.addEventListener('click', () => requestLens());
      rail.appendChild(lensBtn);

      const leaveBtn = document.createElement('button');
      leaveBtn.className = 'hall-rail-btn secondary';
      leaveBtn.textContent = 'Back to the room';
      leaveBtn.addEventListener('click', leaveTable);
      rail.appendChild(leaveBtn);
      return;
    }
    if (!legal || !legal.length) { rail.style.display = 'none'; return; }
    rail.style.display = 'flex'; // ENGINE-VISION.md: bottom rail is ALWAYS <=3 legal buttons
    for (const b of legal) {
      const btn = document.createElement('button');
      btn.className = 'hall-rail-btn';
      btn.textContent = b.label;
      btn.addEventListener('click', () => submitMove(b.id));
      rail.appendChild(btn);
    }
  }

  async function submitMove(moveId) {
    try {
      const res = await api('POST', `/api/hall/tables/${matchId}/move`, { move: moveId });
      renderHand(res.state);
      renderStatus(res.state, res.settlement);
      renderRail(res.legal, res.settlement);
    } catch (e) {
      toast(COPY.illegalHuman);
    }
  }

  async function requestLens() {
    toast(COPY.lensRolling, 6000);
    try {
      await api('POST', `/api/hall/tables/${matchId}/lens`);
      toast(COPY.lensReady);
    } catch (e) {
      if (e.status === 402) toast(COPY.lensInsufficient('—'));
      else if (e.status === 409) toast(COPY.lensNoEvent);
      else if (e.status === 503) toast(COPY.lensDisabled);
      else toast(COPY.lensFail);
    }
  }

  function leaveTable() {
    matchId = null; currentPack = null;
    document.getElementById('view-table').classList.remove('active');
    document.getElementById('view-room').style.display = '';
    document.getElementById('rail').style.display = 'none';
  }

  document.getElementById('btn-leave-table').addEventListener('click', leaveTable);
  document.getElementById('btn-line').addEventListener('click', () => toast('Line chat is coming soon.'));

  renderRoom();
})();
</script>
</body>
</html>
